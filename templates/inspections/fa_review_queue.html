{% extends 'base.html' %}

{% block title %}First Article Review Queue - Multicam Partner Portal{% endblock %}

{% block content %}
<div class="px-4 py-6">
    <h1 class="text-3xl font-bold mb-6">First Article Review Queue</h1>
    
    <div class="card overflow-hidden">
        <div
            id="fa-queue-list"
            hx-get="{% if queue_type == 'final' %}{% url 'inspections:fa_review_queue_final' %}{% else %}{% url 'inspections:fa_review_queue_primary' %}{% endif %}"
            hx-trigger="load, every 10s"
            hx-swap="innerHTML"
        >
            {% include 'inspections/_fa_review_queue_list.html' %}
        </div>
    </div>
</div>
{% endblock %}
